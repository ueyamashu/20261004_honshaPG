<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>ログイン</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
		integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
	<link th:href="@{/css/common.css}" rel="stylesheet">
</head>

<body>
	<header>
		<a th:href="@{/}">
			<img th:src="@{/image/header.jpg}" class="header-img">
		</a>
	</header>
	<div class="container my-5">
		<h2 class="text-center page-title">ログイン</h2>
		<form action="#" th:action="@{/login}" th:object="${tscomLogDto}" method="post" class="my-5">
			<div class="my-5 text-center">
				<span th:text="${error}" class="text-danger"></span>
			</div>
			<div class="mb-5 row">
				<label for="memberId" class="col-sm-2 col-form-label">会員ID</label>
				<div class="col-sm-10">
					<input type="text" th:field="*{memberId}" class="form-control" name="txtMemberId" id="memberId"
						placeholder="会員IDを入力">
					<span th:text="${validationMemberIdError}" class="text-danger"></span>
				</div>
			</div>
			<div class="mb-5 row">
				<label for="memberPassword" class="col-sm-2 col-form-label">パスワード</label>
				<div class="col-sm-10">
					<input type="password" th:field="*{password}" class="form-control" name="txtPassword" id="password"
						placeholder="パスワードを入力">
					<span th:text="${validationPasswordError}" class="text-danger"></span>
				</div>
			</div>
			<div class="text-center">
				<input type="submit" class="btn btn-outline-primary" name="btnLogin" value="ログイン">
			</div>
		</form>
		<div class="my-5 text-center">
			<p>初めての方は新規登録してください</p>
			<a th:href="@{/member/register}" class="btn btn-outline-secondary">登録</a>
		</div>
	</div>
	<footer class="footer">
		<img th:src="@{/image/footer.jpg}">
	</footer>
</body>

</html>
