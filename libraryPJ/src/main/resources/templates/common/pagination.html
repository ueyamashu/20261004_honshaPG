<div>
	<ul class="pagination justify-content-center">
		<!-- 最初へ -->
		<li th:class="${currentPage != 1 ? 'page-item' : 'page-item disabled'}">
			<a class="page-link" th:href="@{${address}+'page=1'}" aria-label="First">
				<span aria-hidden="true">&laquo;</span>
			</a>
		</li>

		<!-- 前へ -->
		<li th:class="${currentPage != 1 ? 'page-item' : 'page-item disabled'}">
			<a class="page-link" th:href="@{${address}+'page='+${currentPage-1}}" aria-label="Previous">
				<span aria-hidden="true">&lt;</span>
			</a>
		</li>

		<!-- ページ番号 -->
		<th:block th:each="i : ${#numbers.sequence(firstNm, lastNm)}">
			<li th:class="'page-item ' + ${i == currentPage ? 'active pagination-active-opacity' : '' }">
				<a class="page-link" th:if="${i != currentPage}" th:href="@{${address}+'page='+${i}}"
					th:text="${i}"></a>
				<a class="page-link" th:unless="${i != currentPage}" th:text="${i}"></a>
			</li>
		</th:block>

		<!-- 次へ -->
		<li th:class="${currentPage != totalPages ? 'page-item' : 'page-item disabled'}">
			<a th:class="page-link" th:href="@{${address}+'page='+${currentPage+1}}" aria-label="Next">
				<span aria-hidden="true">&gt;</span>
			</a>
		</li>

		<!-- 最後へ -->
		<li th:class="${currentPage != totalPages ? 'page-item' : 'page-item disabled'}">
			<a class="page-link" th:href="@{${address}+'page='+${totalPages}}" aria-label="Last">
				<span aria-hidden="true">&raquo;</span>
			</a>
		</li>
	</ul>
</div>
