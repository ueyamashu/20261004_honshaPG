<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>会員情報登録完了</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
		integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
	<link th:href="@{/css/common.css}" rel="stylesheet">
</head>

<body>
	<header>
		<a th:href="@{/}">
			<img th:src="@{/image/header.jpg}" class="header-img">
		</a>
	</header>
	<div class="container my-5">
		<h2 class="text-center page-title">会員情報登録完了</h2>
		<p class="text-center text-danger m-5 h4">
			<strong>パスワードは大切に保管してください</strong>
		</p>
		<div class="m-5">
			<span class="table-wrapper-scroll-y table-scrollbar"
				style="display: block; height: 430px; overflow-x: hidden;">
				<div class="mb-3 row justify-content-center">
					<label for="registrationDate" class="col-sm-2 col-form-label">登録年月日</label>
					<div class="col-sm-6 py-2">
						<span th:text="${outDto.todayDate}"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="memberId" class="col-sm-2 col-form-label">ID</label>
					<div class="col-sm-6 py-2">
						<span th:text="${outDto.memberId}"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="password" class="col-sm-2 col-form-label">パスワード</label>
					<div class="col-sm-6 py-2">
						<span th:text="${outDto.password}"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="membership" class="col-sm-2 col-form-label">会員区分</label>
					<div class="col-sm-6 py-2">
						<th:block th:if="${outDto.memberClass == '0'}">
							一般
						</th:block>
						<th:block th:if="${outDto.memberClass == '1'}">
							職員
						</th:block>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="name" class="col-sm-2 col-form-label">名前</label>
					<div class="col-sm-6 py-2">
						<span th:text="${outDto.name}"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="birthday" class="col-sm-2 col-form-label">生年月日</label>
					<div class="col-sm-6 py-2">
						<span th:text="${outDto.birthday}"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="post" class="col-sm-2 col-form-label">郵便番号</label>
					<div class="col-sm-6 py-2">
						<span th:text="${outDto.postalCode}"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="address" class="col-sm-2 col-form-label">住所</label>
					<div class="col-sm-6 py-2">
						<span th:text="${outDto.address}"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="tel" class="col-sm-2 col-form-label">電話番号</label>
					<div class="col-sm-6 py-2">
						<span th:text="${outDto.telNumber}"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="email" class="col-sm-2 col-form-label">メールアドレス</label>
					<div class="col-sm-6 py-2">
						<span th:text="${outDto.email}"></span>
					</div>
				</div>
			</span>
			<div class="text-center my-5">
				<th:block th:if="${outDto.registId != '9999'}">
					<a th:href="@{/member/list}" class="btn btn-outline-secondary">戻る</a>
				</th:block>
				<th:block th:if="${outDto.registId == '9999'}">
					<a th:href="@{/}" class="btn btn-outline-secondary">戻る</a>
				</th:block>
			</div>
		</div>
	</div>
	<footer class="footer">
		<img th:src="@{/image/footer.jpg}">
	</footer>
</body>

</html>
