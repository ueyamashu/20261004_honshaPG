<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>資料一覧</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
		integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
	<link th:href="@{/css/common.css}" rel="stylesheet">
</head>

<body>
	<header>
		<a th:href="@{/}">
			<img th:src="@{/image/header.jpg}" class="header-img">
		</a>
	</header>
	<div class="container my-5 list-container">
		<h2 class="text-center page-title">資料一覧</h2>
		<div class="my-4">
			<p class="h5 font-weight-bold">検索条件</p>
			<form action="#" th:action="@{/TSBKSBTB10/search}" th:object="${tsbksBtbDto}" method="get">
				<div class="mb-3 row">
					<div class="col-sm-6 row">
						<label for="isbn" class="search-label col-form-label">ISBN番号</label>
						<div class="col-sm-7">
							<input type="text" th:field="*{Isbn}" class="form-control" name="Isbn">
						</div>
					</div>
					<div class="col-sm-6 row">
						<label for="category" class="search-label col-form-label">分類</label>
						<div class="col-sm-7">
							<select class="custom-select" th:field="*{categoryCode}" name="categoryCode">
								<option value="" th:text="選択してください"></option>
								<option th:value="0" th:text="総記"></option>
								<option th:value="1" th:text="哲学"></option>
								<option th:value="2" th:text="歴史"></option>
								<option th:value="3" th:text="社会科学"></option>
								<option th:value="4" th:text="自然科学"></option>
								<option th:value="5" th:text="技術"></option>
								<option th:value="6" th:text="産業"></option>
								<option th:value="7" th:text="芸術"></option>
								<option th:value="8" th:text="言語"></option>
								<option th:value="9" th:text="文学"></option>
							</select>
						</div>
					</div>
				</div>
				<div class="mb-3 row">
					<div class="col-sm-6 row">
						<label for="title" class="search-label col-form-label">資料名</label>
						<div class="col-sm-7">
							<input type="text" th:field="*{bookTitle}" class="form-control" name="bookTitle">
						</div>
					</div>
					<div class="col-sm-6 row">
						<label for="author" class="search-label col-form-label">著者名</label>
						<div class="col-sm-7">
							<input type="text" th:field="*{authorName}" class="form-control" name="authorName">
						</div>
						<input type="submit" class="btn btn-outline-primary" value="検索">
					</div>
				</div>
				<th:block th:if="${validationError != null}">
					<div class="col-sm-10 row">
						<span th:text="${validationError}" class="text-danger"></span>
					</div>
				</th:block>
			</form>
		</div>

		<div>
			<table class="table table-striped text-center">
				<thead>
					<tr>
						<th style="width: 10%;">資料ID</th>
						<th style="width: 10%;">ISBN番号</th>
						<th style="width: 24%;">資料名</th>
						<th style="width: 7%;">分類</th>
						<th style="width: 12%;">著者名</th>
						<th style="width: 8%;">入荷年月日</th>
						<th style="width: 8%;">廃棄年月日</th>
						<th style="width: 7%;">入庫</th>
						<th style="width: 7%;">更新</th>
						<th style="width: 7%;">廃棄</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="book : ${bookList}">
						<td th:text="${book.bookId}" th:title="${book.bookId}"></td>
						<td th:text="${book.isbn}" th:title="${book.isbn}"></td>
						<td th:text="${book.title}" th:title="${book.title}"></td>
						<th:block th:switch="${book.category}">
							<td th:case="0" th:text="総記"></td>
							<td th:case="1" th:text="哲学"></td>
							<td th:case="2" th:text="歴史"></td>
							<td th:case="3" th:text="社会科学"></td>
							<td th:case="4" th:text="自然科学"></td>
							<td th:case="5" th:text="技術"></td>
							<td th:case="6" th:text="産業"></td>
							<td th:case="7" th:text="芸術"></td>
							<td th:case="8" th:text="言語"></td>
							<td th:case="9" th:text="文学"></td>
							<td th:case=*></td>
						</th:block>
						<td th:text="${book.author}" th:title="${book.author}"}></td>
						<td th:text="${#dates.format(book.arrivalDate, 'yyyy/MM/dd')}" th:title="${#dates.format(book.arrivalDate, 'yyyy/MM/dd')}"></td>
						<td th:text="${#dates.format(book.disposalDate, 'yyyy/MM/dd')}" th:title="${#dates.format(book.disposalDate, 'yyyy/MM/dd')}"></td>
						<!-- 入庫修正中 -->
						<td><a th:href="@{/TSBKSBIS20/init/{isbn}(isbn=${book.isbn})}"
								class="btn btn-outline-secondary">入庫</a></td>
						<td><a th:class="${book.disposalDate == null ? 'btn btn-outline-secondary' : 'btn btn-secondary disabled'}"
								th:href="@{/TSBKSBIC20/init/{id}(id=${book.bookId})}">更新</a></td>
						<td><a th:class="${book.disposalDate == null ? 'btn btn-outline-secondary' : 'btn btn-secondary disabled'}"
								th:href="@{/TSBKSBID20/init/{id}(id=${book.bookId})}">廃棄</a></td>
					</tr>
				</tbody>
			</table>
		</div>


		<!-- ページネーション -->
		<div class="row">
			<div class="col-sm my-4"></div>
			<div class="col-sm my-4 " th:insert="common/pagination">
			</div>
			<div class="col-sm text-right my-4">
				<a th:href="@{/TSBKSBIR20/init}" class="btn btn-outline-secondary">登録</a>
				<a th:href="@{/init}" class="btn btn-outline-secondary">戻る</a>
			</div>
		</div>
	</div>
	<!--フッター-->
	<footer class="footer">
		<img th:src="@{/image/footer.jpg}">
	</footer>
</body>

</html>
