<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>資料情報廃棄</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
		integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
	<link th:href="@{/css/common.css}" rel="stylesheet">
</head>

<body>
	<header>
		<a th:href="@{/}">
			<img th:src="@{/image/header.jpg}" class="header-img">
		</a>
	</header>
	<div class="container my-5">
		<h2 class="text-center page-title">資料情報廃棄</h2>
		<form action="#" th:action="@{/TSBKSBID30/init}" method="post" th:object="${inDto}" class="m-5">
			<input type="hidden" name="bookId" th:value="*{bookId}">
			<div class="mb-3 row justify-content-center">
				<span th:text="${validationBookIdError}" class="text-danger"></span>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="disposal" class="col-sm-2 col-form-label">廃棄年月日</label>
				<div class="col-sm-6">
					<input type="text" class="form-control" name="disposalDate" th:value="*{disposalDate}"
						placeholder="（例）2000/11/22">
					<span th:text="${validationDisposalDateError}" class="text-danger"></span>
					<p class="mt-2 mb-0">※yyyy/mm/dd形式で入力してください</p>
				</div>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="note" class="col-sm-2 col-form-label">備考</label>
				<div class="col-sm-6">
					<textarea type="text" class="form-control" rows="10" name="disposalNote"
						placeholder="（例）本が破れてしまったため">[[*{disposalNote}]]</textarea>
					<span th:text="${validationDisposalNoteError}" class="text-danger"></span>
				</div>
			</div>
			<div class="text-center my-5">
				<input type="submit" class="btn btn-outline-primary" value="確認" th:disabled="*{rentalFlag} == '0'">
				<a th:href="@{/book/list}" class="btn btn-outline-secondary">戻る</a>
			</div>
		</form>
	</div>
	<footer class="footer">
		<img th:src="@{/image/footer.jpg}">
	</footer>
</body>

</html>
