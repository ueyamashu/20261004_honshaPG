<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>資料返却確認</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
		integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
	<link th:href="@{/css/common.css}" rel="stylesheet">
</head>

<body>
	<header>
		<a th:href="@{/}">
			<img th:src="@{/image/header.jpg}" class="header-img">
		</a>
	</header>
	<div class="container my-5 list-container">
		<h2 class="text-center page-title">資料返却確認</h2>
		<form id="rentalForm" action="#" th:action="@{/TSRTNRTB30/complete}" th:object="${inDto}" method="get" class="m-5">
			<input type="hidden" th:field="*{rentalIdList}">
			<div>
				<table class="table table-striped text-center">
					<thead>
						<tr>
							<th>会員ID</th>
							<th>資料ID</th>
							<th>名前</th>
							<th>資料名</th>
							<th>返却期限</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="rental : ${outDto}">
							<td th:text="${rental.memberId}" th:title="${rental.memberId}"></td>
							<td th:text="${rental.bookId}" th:title="${rental.bookId}"></td>
							<td th:text="${rental.name}" th:title="${rental.name}"></td>
							<td th:text="${rental.title}" th:title="${rental.title}"></td>
							<td th:text="${#dates.format(rental.rentalDueDate, 'yyyy/MM/dd')}" th:title="${#dates.format(rental.rentalDueDate, 'yyyy/MM/dd')}"></td>
						</tr>
					</tbody>
				</table>
			</div>
			<th:block th:if="${overDueDayFlg == '1'}">
				<div class="text-right my-4">
					<!--延滞資料がある場合-->
					<button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
						data-bs-target="#delayInfoModal">返却 </button>
					<a th:href="@{/book/return/list}" class="btn btn-outline-secondary">戻る</a>
				</div>
			</th:block>
			<th:block th:if="${overDueDayFlg == '0'}">
				<div class="text-right my-4">
					<!--延滞資料がない場合-->
					<input type="submit" class="btn btn-outline-primary" value="返却" />
					<a th:href="@{/book/return/list}" class="btn btn-outline-secondary">戻る</a>
				</div>
			</th:block>

			<!-- Modal -->
			<div class="modal fade" id="delayInfoModal" tabindex="-1" aria-labelledby="delayInfoModalLabel"
				aria-hidden="true">
				<div class="modal-dialog modal-lg">
					<div class="modal-content">
						<div class="modal-header">
							<h3 class="modal-title" id="delayInfoModalLabel">延滞お知らせ</h3>
						</div>
						<div class="modal-body">
							<table class="table table-striped text-center">
								<thead>
									<p class="h7 text-secondary">下記の資料は返却期限を経過しました。</p>
								</thead>
								<tbody>
									<tr th:if="${rental.overDueDays gt 0}" th:each="rental : ${outDto}">
										<td th:text="'資料ID：' + ${rental.bookId}"></td>
										<td th:text="'返却予定日：' + ${#dates.format(rental.rentalDueDate, 'yyyy/MM/dd')}">
										</td>
										<td th:text="'延滞期間：' + ${rental.overDueDays}"></td>
									</tr>
								</tbody>
							</table>
						</div>
						<div class="text-center my-5">
							<input type="submit" class="btn btn-primary" value="確認">
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">閉じる</button>
						</div>
					</div>
				</div>
			</div>
		</form>
	</div>
	<footer class="footer">
		<img th:src="@{/image/footer.jpg}">
	</footer>
</body>

</html>
