<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>資料情報廃棄完了</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
		integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
	<link th:href="@{/css/common.css}" rel="stylesheet">
</head>

<body>
	<header>
		<a th:href="@{/}">
			<img th:src="@{/image/header.jpg}" class="header-img">
		</a>
	</header>
	<div class="container my-5">
		<h2 class="text-center page-title">資料情報廃棄完了</h2>
		<div class="m-5">
			<div class="mb-3 row justify-content-center">
				<label for="bookId" class="col-sm-2 col-form-label">資料ID</label>
				<div class="col-sm-6 py-2">
					<p th:text="${tsbksbid40dto.bookId}"></p>
				</div>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="releaseDate" class="col-sm-2 col-form-label">廃棄年月日</label>
				<div class="col-sm-6 py-2">
					<p th:text="${tsbksbid40dto.DisposalDate}"></p>
				</div>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="isbn" class="col-sm-2 col-form-label">備考</label>
				<div class="col-sm-6 py-2">
					<p th:text="${tsbksbid40dto.DisposalNote}"></p>
				</div>
			</div>
			<div class="text-center my-5">
				<a th:href="@{/book/list}" class="btn btn-outline-secondary">戻る</a>
			</div>
		</div>
	</div>
	<footer class="footer">
		<img th:src="@{/image/footer.jpg}">
	</footer>
</body>

</html>
