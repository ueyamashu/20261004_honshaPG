<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>資料入庫確認</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
		integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
	<link th:href="@{/css/common.css}" rel="stylesheet">
</head>

<body>
	<header>
		<a th:href="@{/}">
			<img th:src="@{/image/header.jpg}" class="header-img">
		</a>
	</header>
	<div class="container my-5">
		<h2 class="text-center page-title">資料入庫確認</h2>
		<form action="#" th:action="@{/TSBKSBIS30/confirm}" th:object="${tsbksbis20dto}" method="post" class="m-5">
			<div class="mb-3 row justify-content-center">
				<label for="isbn" class="col-sm-2 col-form-label">ISBN番号</label>
				<div class="col-sm-6 py-2">
					[[*{isbn}]]
					<input type="hidden" name="isbn" th:value="*{isbn}">
				</div>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="title" class="col-sm-2 col-form-label">資料名</label>
				<div class="col-sm-6 py-2">
					[[*{title}]]
					<input type="hidden" name="title" th:value="*{title}">
				</div>
			</div>
			<div class="mb-2 row justify-content-center">
				<label for="category" class="col-sm-2 col-form-label">分類</label>
				<div class="col-sm-6 py-2">
					<th:block th:switch="*{category}">
						<label th:case="0" th:text="総記"></label>
						<label th:case="1" th:text="哲学"></label>
						<label th:case="2" th:text="歴史"></label>
						<label th:case="3" th:text="社会科学"></label>
						<label th:case="4" th:text="自然科学"></label>
						<label th:case="5" th:text="技術"></label>
						<label th:case="6" th:text="産業"></label>
						<label th:case="7" th:text="芸術"></label>
						<label th:case="8" th:text="言語"></label>
						<label th:case="9" th:text="文学"></label>
						<label th:case=*></label>
					</th:block>
					<input type="hidden" name="category" th:value="*{category}">
				</div>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="author" class="col-sm-2 col-form-label">著者名</label>
				<div class="col-sm-6 py-2">
					[[*{author}]]
					<input type="hidden" name="author" th:value="*{author}">
				</div>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="publisher" class="col-sm-2 col-form-label">出版社</label>
				<div class="col-sm-6 py-2">
					[[*{publisher}]]
					<input type="hidden" name="publisher" th:value="*{publisher}">
				</div>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="releaseDate" class="col-sm-2 col-form-label">出版日</label>
				<div class="col-sm-6 py-2">
					[[*{releaseDate}]]
					<input type="hidden" name="releaseDate" th:value="*{releaseDate}">
				</div>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="countBook" class="col-sm-2 col-form-label">資料の本数</label>
				<div class="col-sm-6 py-2">
					[[*{bookCount}]]
					<input type="hidden" name="bookCount" th:value="*{bookCount}">
				</div>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="addBookCount" class="col-sm-2 col-form-label">追加本数</label>
				<div class="col-sm-6 py-2">
					[[*{addBookCount}]]
					<input type="hidden" name="addBookCount" th:value="*{addBookCount}">
				</div>
			</div>
			<div class="mb-3 row justify-content-center">
				<label for="arrivalDate" class="col-sm-2 col-form-label">入荷年月日</label>
				<div class="col-sm-6 py-2">
					[[*{arrivalDate}]]
					<input type="hidden" name="arrivalDate" th:value="*{arrivalDate}">
				</div>
			</div>
			<div class="text-center my-5">
				<input type="submit" class="btn btn-outline-primary" value="入庫">
				<a onclick="history.back()" class="btn btn-outline-secondary">キャンセル</a>
			</div>
		</form>
	</div>
	<footer class="footer">
		<img th:src="@{/image/footer.jpg}">
	</footer>
</body>

</html>
