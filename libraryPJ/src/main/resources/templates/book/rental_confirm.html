<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>資料貸出確認</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
		integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
	<link th:href="@{/css/common.css}" rel="stylesheet">
	<script th:src="@{/js/tsrenrbr30.js}"></script>
</head>

<body>
	<header>
		<a th:href="@{/}">
			<img th:src="@{/image/header.jpg}" class="header-img">
		</a>
	</header>
	<div class="container my-5 list-container">
		<h2 class="text-center page-title">資料貸出確認</h2>
		<form th:action="@{/TSRENRBR30/complete}" th:object="${tsrenrbtDto}" method="post" class="m-5" name="confirmForm">
			<div class="row my-1">
				<div class="col-sm-1">
					<h5 class="font-weight-bold">会員ID</h5>
				</div>
				<div class="col-sm-11">
					[[*{memberId}]]
					<input type="hidden" name="memberId" th:value="*{memberId}">
				</div>
			</div>
			<div class="row my-1">
				<div class="col-sm-1">
					<h5 class="font-weight-bold">名前</h5>
				</div>
				<div class="col-sm-11">
					[[${userName}]]
					<input type="hidden" name="userName" th:value="${userName}">
				</div>
			</div>
			<div>
				<table class="table table-striped text-center">
					<thead>
						<tr>
							<th>資料ID</th>
							<th>資料名</th>
							<th>返却期限</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="rental,st : ${rentalList}">
							<td th:text="${rental.bookId}" th:title="${rental.bookId}"></td>
							<input type="hidden" name=="*{bookList[__${st.index}__].bookId" th:value="${rental.bookId}">
							<td th:text="${rental.title}" th:title="${rental.title}"></td>
							<td th:text="${rental.rentalDueDate}" th:title="${rental.rentalDueDate}"></td>
						</tr>
					</tbody>
				</table>
				<input type="hidden" name="rentalList" th:value="${rentalList}">
			</div>
			<div class="text-right my-5">
				<input type="submit" class="btn btn-outline-primary" value="貸出">
				<button type="button" name="back" class="btn btn-outline-secondary"
					th:onclick="|bookRentalConfirmFormSubmit()|">キャンセル</button>
			</div>
		</form>
	</div>
	<footer class="footer">
		<img th:src="@{/image/footer.jpg}">
	</footer>
</body>

</html>
