<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>資料情報登録</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
		integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
	<link th:href="@{/css/common.css}" rel="stylesheet">
</head>

<body>
	<header>
		<a th:href="@{/}">
			<img th:src="@{/image/header.jpg}" class="header-img">
		</a>
	</header>
	<div class="container my-5">
		<h2 class="text-center page-title">資料情報登録</h2>
		<form action="#" th:action="@{/TSBKSBIR30/init}" method="post" th:object="${registerData}" class="m-5">
			<span class="table-wrapper-scroll-y table-scrollbar"
				style="display: block; height: 510px; overflow-x: hidden;">
				<div class="mb-3 row justify-content-center">
					<label for="title" class="col-sm-2 col-form-label">資料名</label>
					<div class="col-sm-6">
						<input type="text" class="form-control" id="title" th:field="*{title}">
						<span th:text="${titleErrorMessage}" class="text-danger"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="category" class="col-sm-2 col-form-label">分類</label>
					<div class="col-sm-6">
						<select class="custom-select" id="category" th:field="*{category}">
							<option value="" th:text="選択してください"></option>
							<option th:value="0" th:text="総記" th:selected="${category == 0}"></option>
							<option th:value="1" th:text="哲学" th:selected="${category == 1}"></option>
							<option th:value="2" th:text="歴史" th:selected="${category == 2}"></option>
							<option th:value="3" th:text="社会科学" th:selected="${category == 3}"></option>
							<option th:value="4" th:text="自然科学" th:selected="${category == 4}"></option>
							<option th:value="5" th:text="技術" th:selected="${category == 5}"></option>
							<option th:value="6" th:text="産業" th:selected="${category == 6}"></option>
							<option th:value="7" th:text="芸術" th:selected="${category == 7}"></option>
							<option th:value="8" th:text="言語" th:selected="${category == 8}"></option>
							<option th:value="9" th:text="文学" th:selected="${category == 9}"></option>
						</select>
						<span th:text="${categoryErrorMessage}" class="text-danger"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="author" class="col-sm-2 col-form-label">著者名</label>
					<div class="col-sm-6">
						<input type="text" class="form-control" id="author" th:field="*{author}">
						<span th:text="${authorErrorMessage}" class="text-danger"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="publisher" class="col-sm-2 col-form-label">出版社</label>
					<div class="col-sm-6">
						<input type="text" class="form-control" id="publisher" th:field="*{publisher}">
						<span th:text="${publisherErrorMessage}" class="text-danger"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="releaseDate" class="col-sm-2 col-form-label">出版日</label>
					<div class="col-sm-6">
						<input type="text" class="form-control" id="releaseDate" th:field="*{releaseDate}"
							placeholder="（例）2000/11/22">
						<p class="mt-2 mb-0">※yyyy/mm/dd形式で入力してください</p>
						<span th:text="${releaseDateErrorMessage}" class="text-danger"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="isbn" class="col-sm-2 col-form-label">ISBN番号</label>
					<div class="col-sm-6">
						<input type="text" class="form-control" id="isbn" th:field="*{isbn}"
							placeholder="（例）1234567891011">
						<p class="mt-2 mb-0">※13桁の数字を入力してください（半角数字）</p>
						<span th:text="${isbnErrorMessage}" class="text-danger"></span>
					</div>
				</div>
				<div class="mb-3 row justify-content-center">
					<label for="arrival" class="col-sm-2 col-form-label">入荷年月日</label>
					<div class="col-sm-6">
						<input type="text" class="form-control" id="arrival" th:field="*{arrival}"
							placeholder="（例）2000/11/22">
						<p class="mt-2 mb-0">※yyyy/mm/dd形式で入力してください</p>
						<span th:text="${arrivalDateErrorMessage}" class="text-danger"></span>
					</div>
				</div>
			</span>
			<div class="text-center my-5">
				<input type="submit" class="btn btn-outline-primary" value="確認">
				<a th:href="@{/book/list}" class="btn btn-outline-secondary">戻る</a>
			</div>
		</form>
	</div>
	<footer class="footer">
		<img th:src="@{/image/footer.jpg}">
	</footer>
</body>

</html>
