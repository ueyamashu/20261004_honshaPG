<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<title>パスワード変更確認</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
		integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz" crossorigin="anonymous">
	<link th:href="@{/css/common.css}" rel="stylesheet">
</head>

<body>
	<header>
		<a th:href="@{/}">
			<img th:src="@{/image/header.jpg}" class="header-img">
		</a>
	</header>
	<div class="container my-5">
		<h2 class="text-center page-title">パスワード変更確認</h2>
		<p class="text-center text-danger m-5 h4">
			<span th:text="${error}" class="text-danger"></span>
		</p>
		<form action="#" th:action="@{/TSMEMMPC30/confirm}" method="post" th:object="${tsmemmpc20Dto}" class="m-5">
			<div class="mb-5 row">
				<label for="memberId" class="col-sm-2 col-form-label">会員ID</label>
				<div class="col-sm-6 py-2">
					[[*{memberId}]]
					<input type="hidden" name="memberId" th:value="*{memberId}">
				</div>
			</div>
			<div class="mb-5 row">
				<label for="name" class="col-sm-2 col-form-label">名前</label>
				<div class="col-sm-6 py-2">
					[[*{name}]]
					<input type="hidden" name="name" th:value="*{name}">
				</div>
			</div>
			<div class="mb-5 row">
				<label for="memberPasswordNew" class="col-sm-2 col-form-label">パスワード</label>
				<div class="col-sm-6 py-2">
					[[*{memberPasswordNew}]]
					<input type="hidden" name="memberPasswordNew" th:value="*{memberPasswordNew}">
				</div>
			</div>
			<div class="text-center my-5">
				<th:block th:if="${error == null}">
					<input type="submit" class="btn btn-outline-primary" value="変更">
				</th:block>
				<a th:href="@{/TSMEMMPC20/init}" class="btn btn-outline-secondary">キャンセル</a>
			</div>
			<input type="hidden" class="form-control" name="exclusiveKey" th:value="*{exclusiveKey}">
			<input type="hidden" class="form-control" name="memberPassword" th:value="*{memberPassword}">
			<input type="hidden" class="form-control" name="password" th:value="*{password}">
		</form>
	</div>
	<footer class="footer">
		<img th:src="@{/image/footer.jpg}">
	</footer>
</body>

</html>
